name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('sticks3-play/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d sticks3-play

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep -I as a separate argument: some GCC versions swallow the first
      # character of a joined -Ipath that starts with "s".
      - run: g++ -std=c++17 -Wall -Wextra -I sticks3-play/src tests/test_ai.cpp sticks3-play/src/game/ai.cpp -o test_ai
      - run: ./test_ai